<!DOCTYPE html>
<html lang="en">
<head>
    <title>Course Registration</title>
</head>
<body>

     <h1>Course Registration</h1>

     <form action = "thankyou.html">

    <fieldset>
        <legend>Personal Details</legend>
    
        <table>
            <tr>
                <td><lable>First Name</lable></td>
                <td><input type="text" name="FirstName" placeholder="Ex:Daemon" size="16" required></td>
            </tr>

            <tr>
                <td><lable>Surname</lable></td>
                <td><input type=""text name="Surname" placeholder="Ex:Targereyn" size="16" required></td>
            </tr>

            <tr>
                <td><lable>Mobile Number</lable></td>
                <td><input type="number" name="Mobile Number" placeholder="Ex:123-456-789" size="16" required></td>
            </tr>

            <tr>
                <td><lable>Email</lable></td>
                <td><input type="email" name="Email" placeholder="Ex:daemon@gmail.com" size="16" required></td>
            </tr>

            <tr>
                <td><lable>Password</lable></td>
                <td><input type="password" name="Password" size="16" required></td>
            </tr>

            <tr>
                <td><lable>Confirm Password</lable></td>
                <td><input type="password" name="Confirm Password" size="16" required></td>
            </tr>

            <tr>
                <td><lable>DOB</lable></td>
                <td><input type="date" name="DOB" required></td>
            </tr>

            <tr>
                <td> <lable>Gender</lable></td>
                <td><input type="radio" name="Gender" required>Male
                 <input type="radio" name="Gender" required>Female
                 <input type="radio" name="Gender" required>Others</td>
                 
            </tr>

            <tr>
                <td><lable>Select Country</lable></td>
                <td><select>
            <option>INDIA</option>
            <option>TITAN</option>
            <option>Wakanda</option>
            <option>Dragon Stone</option>
        </select></td>
            </tr>

            <tr>
                <td> <lable>Upload Picture</lable></td>
                <td><input type="file" name="Upload Picture" required></td>
            </tr>
  
        </table>
       
        <input type="reset"><br><br>

        <input type="submit">
        
       
    </fieldset>

    </form>

</body>
</html>
